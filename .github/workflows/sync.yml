name: Sync rezultata

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Proba (samo rucno pokretanje, nista ne upisuje)
        if: github.event_name == 'workflow_dispatch'
        run: python sync.py --dry-run --probe
        continue-on-error: true
      - name: Preuzmi rezultate i upisi u Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync.py --loop 3300 --every 40
